<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/dedicated.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shard</title>
    <script type="module" src="/src/dedicated.ts" defer></script>
  </head>
  <body>
    <div class="dedicated-app">

      <!-- Custom Titlebar (decorations: false) -->
      <div class="dedicated-titlebar" data-tauri-drag-region>
        <span class="dedicated-titlebar-title" data-tauri-drag-region>Shard</span>
        <div class="dedicated-titlebar-controls">
          <button id="dedicated-minimize-btn" class="titlebar-btn" title="Minimize" aria-label="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
              <rect x="0" y="4.5" width="10" height="1" rx="0.5"/>
            </svg>
          </button>
          <button id="dedicated-close-btn" class="titlebar-btn titlebar-btn-close" title="Return to Ambient" aria-label="Return to Ambient Mode">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <line x1="2" y1="2" x2="8" y2="8"/>
              <line x1="8" y1="2" x2="2" y2="8"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Main Layout: Sidebar + Content -->
      <div class="dedicated-layout">

        <!-- Sessions Sidebar -->
        <aside class="dedicated-sidebar">
          <div class="sidebar-header">
            <div class="sidebar-search-wrap">
              <svg class="sidebar-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input id="dedicated-session-search" class="sidebar-search" type="search" placeholder="Search chats…" aria-label="Search sessions"/>
            </div>
          </div>
          <div id="dedicated-sessions-list" class="sidebar-sessions-list" role="list" aria-label="Recent sessions">
            <!-- Populated by dedicated.ts -->
          </div>
          <div class="sidebar-footer">
            <button id="dedicated-new-chat-btn" class="sidebar-new-chat-btn" title="New Chat" aria-label="Start new chat">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              New Chat
            </button>
          </div>
        </aside>

        <!-- Chat Content -->
        <main class="dedicated-content">
          <div id="dedicated-chat-area" class="dedicated-chat-area" role="log" aria-live="polite" aria-label="Chat messages">
            <!-- Messages injected by dedicated.ts -->
          </div>

          <!-- Input Bar -->
          <div class="dedicated-bottom-bar">
            <div class="dedicated-action-row">
              <button id="dedicated-ocr-btn" class="action-btn" title="OCR Capture (Ctrl+K)" aria-label="Capture Screen">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              </button>
              <button id="dedicated-settings-btn" class="action-btn" title="Settings" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              </button>
              <!-- Spacer -->
              <div style="flex: 1;"></div>
              <button id="dedicated-ambient-btn" class="ambient-return-btn" title="Return to Ambient Mode" aria-label="Return to Ambient Mode">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="9 3 3 3 3 9"></polyline>
                  <polyline points="15 21 21 21 21 15"></polyline>
                  <line x1="3" y1="3" x2="10" y2="10"></line>
                  <line x1="21" y1="21" x2="14" y2="14"></line>
                </svg>
                Ambient
              </button>
            </div>
            <div class="dedicated-input-wrap">
              <label for="dedicated-input-field" class="visually-hidden">Message</label>
              <textarea id="dedicated-input-field" class="dedicated-input-field" placeholder="Ask anything…" rows="1" aria-label="Type your message"></textarea>
              <button id="dedicated-stop-btn" class="stop-btn" title="Stop Generation" aria-label="Stop Generation" style="display:none;">
                <div class="stop-icon" aria-hidden="true"></div>
              </button>
            </div>
          </div>

          <!-- Settings modal placeholder (injected by dedicated.ts) -->
          <div id="dedicated-settings-modal" class="settings-modal hidden"></div>
        </main>
      </div>
    </div>
  </body>
</html>
