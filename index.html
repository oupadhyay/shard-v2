<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shard</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-ui">
      <div id="app">
        <section class="ambient-surface" aria-label="Shard">
          <section id="ambient-view" class="ambient-view" aria-labelledby="ambient-view-title" hidden>
            <header class="ambient-view-header">
              <button id="ambient-view-close" class="icon-btn" type="button" aria-label="Back to conversation">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg>
              </button>
              <h2 id="ambient-view-title">Shard</h2>
            </header>
            <div id="ambient-view-content" class="ambient-view-content"></div>
          </section>

          <div id="chat-area" class="chat-area" aria-live="polite"></div>

          <div class="bottom-bar">
            <div class="input-container">
              <details id="shard-menu" class="shard-menu">
                <summary aria-label="More from Shard" title="More from Shard">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5" /></svg>
                  <span id="unread-sessions-badge" class="unread-badge hidden"></span>
                </summary>
                <nav aria-label="More from Shard">
                  <button id="sessions-btn" type="button">History</button>
                  <button id="memory-btn" type="button">Saved memory</button>
                  <button id="routines-btn" type="button">Routines</button>
                  <button id="settings-btn" type="button">Settings</button>
                  <button id="ocr-btn" type="button">Capture screen <kbd>Ctrl K</kbd></button>
                  <button id="breakout-btn" type="button">Open dedicated view</button>
                  <button id="trash-btn" type="button">Clear conversation</button>
                </nav>
              </details>
              <label for="input-field" class="visually-hidden">Message</label>
              <textarea id="input-field" class="input-field" placeholder="Ask anything…" rows="1" aria-label="Message Shard"></textarea>
              <button id="send-btn" class="send-btn" type="button" title="Send" aria-label="Send message" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
              </button>
              <button id="stop-btn" class="stop-btn" type="button" title="Stop generation" aria-label="Stop generation" style="display: none;">
                <div class="stop-icon" aria-hidden="true"></div>
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
