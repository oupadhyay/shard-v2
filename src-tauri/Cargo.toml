[package]
name = "shard"
version = "0.2.0"
description = "An AI Research Companion"
authors = ["oupadhyay"]
edition = "2021"

[lib]
name = "shard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
quick-xml = { version = "0.37.5", features = ["serialize"] }
time = { version = "0.3.47", features = ["macros", "serde", "formatting", "parsing"] }
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-log = "2"
arboard = "3"
yahoo_finance_api = "2"
wikipedia = "0.3"
scraper = "0.19"
image = "0.25"
screenshots = "0.6"
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12.2"
lazy_static = "1.4"
unicode-segmentation = "1.12.0"
rust-stemmers = "1.2.0"
stop-words = "0.8.0"
dirs = "5"
ocr-rs = "2.0.2"
futures = "0.3.31"
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1"
bytemuck = "1.16"
sha2 = "0.10"
readability = "0.3.0"
htmd = "0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
window-vibrancy = "0.6"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3" }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
dotenvy = "0.15"
rand = "0.8"

[[bench]]
name = "retrieval_bench"
harness = false

[[bench]]
name = "vision_bench"
harness = false

[[bench]]
name = "screen_context_bench"
harness = false

[[bench]]
name = "optimizations_bench"
harness = false

[[bench]]
name = "history_serialization_bench"
harness = false

[[bench]]
name = "vector_search_bench"
harness = false

[[bench]]
name = "migration_bench"
harness = false

[[bench]]
name = "sessions_bench"
harness = false

[[bench]]
name = "skills_bench"
harness = false
