[package]
name = "shard-external-tools"
version = "0.1.0"
description = "Host-free external API tools for Shard"
edition = "2021"
publish = false

[dependencies]
shard-tool-api = { path = "../shard-tool-api" }
log = "0.4"
quick-xml = { version = "0.37.5", features = ["serialize"] }
regex = "1.12.2"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3.47"
urlencoding = "2.1"
yahoo_finance_api = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
