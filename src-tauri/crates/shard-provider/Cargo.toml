[package]
name = "shard-provider"
version = "0.1.0"
description = "Host-free provider transports and wire contracts for Shard"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
